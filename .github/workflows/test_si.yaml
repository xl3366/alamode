name: Test Si example

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.9']
    name: OS ${{ matrix.os }} Python ${{ matrix.python-version }} 
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: alamode
          python-version: ${{ matrix.python-version }}
     
      - name: Get Date
        id: get-date
        run: echo "today=$(/bin/date -u '+%Y%m%d')" >> $GITHUB_OUTPUT
        shell: bash
         
      - name: Update environment
        run: conda env update -n alamode -f etc/alamode-environment.yml
        if: steps.cache.outputs.cache-hit != 'true'
        
      - run: |
          conda info
          conda list
          conda config --show-sources
          conda config --show
          printenv | sort
          
      - name: Install conda libraries
        run: conda install numpy scipy h5py compilers spglib=2.3.1 boost eigen cmake openmpi fftw
        
      - run: echo ${CC} ${CXX}

      - name: Fix and Build with cmake
        run: |
          # 临时修复：设置环境变量
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          mkdir -p _build
          cd _build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j
          cd ..
      
      - name: Run test Si
        working-directory: ./test
        run: python test_si.py
        
      - name: Compress _build directory
        run: |
          # 压缩_build目录
          tar -czf build-artifacts.tar.gz _build/
          # 显示压缩文件信息
          ls -lh build-artifacts.tar.gz
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build-artifacts.tar.gz
          retention-days: 30
