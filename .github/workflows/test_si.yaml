name: Test Si example0 and Release

on:
  push:
    branches:
      - develop
  release:
    types: [published]

env:
  CONDA_ENV_NAME: alamode
  CONDA_ENV_FILE: etc/alamode-environment.yml

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10']
    name: OS ${{ matrix.os }} Python ${{ matrix.python-version }}
    defaults:
      run:
        shell: bash -l {0}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: ${{ env.CONDA_ENV_NAME }}
          python-version: ${{ matrix.python-version }}
          auto-activate-base: false
          
      - name: Get current date
        id: date
        run: echo "date=$(date -u '+%Y%m%d')" >> $GITHUB_OUTPUT
        
      - name: Cache conda environment
        uses: actions/cache@v4
        with:
          path: $CONDA/envs
          key: conda-${{ runner.os }}-${{ matrix.python-version }}-${{ steps.date.outputs.date }}-${{ hashFiles(env.CONDA_ENV_FILE) }}
          restore-keys: |
            conda-${{ runner.os }}-${{ matrix.python-version }}-${{ steps.date.outputs.date }}-
            conda-${{ runner.os }}-${{ matrix.python-version }}-
            
      - name: Update environment
        run: |
          conda env update -n $CONDA_ENV_NAME -f $CONDA_ENV_FILE
          conda activate $CONDA_ENV_NAME
          
      - name: Install required conda packages
        run: |
          conda install -y numpy scipy h5py compilers spglib boost eigen cmake openmpi fftw
          
      - name: Show environment info
        run: |
          conda info
          conda list
          conda config --show
          which cmake
          echo "CC: $CC"
          echo "CXX: $CXX"
          
      - name: Configure and build with CMake
        run: |
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          mkdir -p _build
          cd _build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_DEFAULT_CMP0091=NEW ..
          make -j$(nproc)
          
      - name: Run Si test
        working-directory: ./test
        run: |
          python test_si.py
          
      - name: Upload build artifacts
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: alamode-build-${{ github.sha }}
          path: |
            _build/
            !_build/CMakeFiles/
          retention-days: 30

  create-release:
    if: github.event_name == 'release'
    needs: build-and-test
    runs-on: ubuntu-latest
    name: Create Release Assets
    
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: alamode-build-${{ github.sha }}
          path: downloaded-artifacts
          
      - name: List downloaded files
        run: ls -la downloaded-artifacts/
        
      - name: Create release assets package
        run: |
          mkdir -p release-assets
          cp -r downloaded-artifacts/_build/* release-assets/ || true
          tar -czf alamode-binaries-${{ github.sha }}.tar.gz release-assets/
          ls -la
          
      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./alamode-binaries-${{ github.sha }}.tar.gz
          asset_name: alamode-binaries-${{ github.sha }}.tar.gz
          asset_content_type: application/gzip

  auto-release:
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    name: Auto Create Release on Success
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: auto-release-${{ github.sha }}
          release_name: Auto Release ${{ github.sha }}
          draft: false
          prerelease: true
          generate_release_notes: true
